[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wp-hunter"
version = "2.1.0"
description = "Bilingual WordPress plugin collection and Semgrep triage toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Aryoksss" }]
dependencies = [
  "requests>=2.34.2,<3",
  "typer>=0.16,<1",
  "rich>=13.9,<15",
  "questionary>=2.1,<3",
]

[project.optional-dependencies]
memory = ["psutil>=7.2.2,<8"]
dev = [
  "build>=1.2,<2",
  "coverage[toml]>=7.6,<8",
  "mypy>=1.11,<2",
  "pip-audit>=2.9,<3",
  "ruff>=0.12,<1",
]

[project.scripts]
wp-hunter = "wp_hunter.cli:run"

[tool.setuptools.packages.find]
include = ["wp_hunter*"]

[tool.setuptools.package-data]
wp_hunter = ["resources/*.yml", "resources/locales/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["wp_hunter"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
# Gradual adoption: bare dict/list annotations are still widespread.
disallow_any_generics = false
disallow_untyped_defs = false

[tool.coverage.run]
source = ["wp_hunter"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
